# SentinelForge's own stack. CyberLab is a separate stack (cyberlab/docker-compose.yml) —
# run both, SentinelForge reaches CyberLab over the host network via host.docker.internal.
#
# juiceshop: a second, independent demo target (OWASP Juice Shop, public image, no build needed)
# used to prove the TargetAdapter pattern is real and not hardcoded to CyberLab — see
# modules/targets/juiceshop/ and docs/SECOND-TARGET.md.
services:
  juiceshop:
    image: bkimminich/juice-shop
    ports:
      - "3002:3000"
    networks:
      - sentinelforge

  mongo:
    image: mongo:7
    volumes:
      - sentinelforge_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sentinelforge

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/sfplatform
      - CYBERLAB_URL=http://host.docker.internal:3001
    ports:
      - "4000:4000"
    volumes:
      # Read-only: lets the real Semgrep scan (VULN-006 check) analyze CyberLab's actual source.
      - ../cyberlab/server/src:/cyberlab-src:ro
      # Read-only: lets the real SCA/dependency scan (modules/scanner/sca.ts) read CyberLab's
      # actual manifest and run it against the real OSV vulnerability database.
      - ../cyberlab/server/package.json:/cyberlab-root/package.json:ro
      - ../cyberlab/server/package-lock.json:/cyberlab-root/package-lock.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sentinelforge

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sentinelforge

volumes:
  sentinelforge_mongo_data:

networks:
  sentinelforge:
    driver: bridge
